# capa_configbroker - package manifest.
#
# ConfigBroker is a capability-secured configuration / secret resolver
# that puts fetched secrets under the Capa compiler's information-flow
# check against logs, telemetry and public output. The evidence is that
# check plus the capability SBOM the compiler emits for this very
# program:
#
#   * the fetched secret VALUES are @secret; the compiler reports a flow
#     it detects to the audit log, the console, or a network sink that
#     does not cross the single audited declassify in resolve.capa.
#
#   * the Net capability is attenuated to a SINGLE upstream host, checked
#     at runtime; the SBOM records the restrict_to(host) call.
#
# One dependency, capability-free, resolved as a VERIFIED git
# dependency. `capa install` fetches it at its GPG-signed tag, verifies
# the tag signature against verify_key and its SLSA provenance, records
# the pinned commit in capa.lock, and vendors it under vendor/ (git-
# ignored):
#
#   capa_hash - SHA-256, used for the audit-log integrity fingerprint
#               (over PUBLIC audit text; no secret is hashed).
#
# The dependency holds no authority, so the ConfigBroker capability
# surface stays what configbroker.capa acquires: Stdio, Fs and Net
# (attenuated to one host). The compiler's --manifest / --cyclonedx
# output records it.

[package]
name = "capa_configbroker"
version = "0.1.0"
capa = ">=1.15.1"

[dependencies.capa_hash]
git = "https://github.com/nelsonduarte/capa_hash"
tag = "v0.1.2"
verify_key = "6C1D222D491FB88031E041A536CFB426101AA24B"
